name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/heval-runner
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value={{branch}},enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Push only on main branch pushes; PRs build without pushing.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify harnesses
        run: |
          # On PRs the image is loaded locally; on main it's pushed.
          # Pull the sha-tagged image for verification so both paths work.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE="heval-runner:latest"
          else
            IMAGE="ghcr.io/${{ github.repository_owner }}/heval-runner:sha-$(git rev-parse --short HEAD)"
            docker pull "$IMAGE"
          fi
          docker run --rm "$IMAGE" bash -c '
            echo "=== Harnesses ===" &&
            claude --version &&
            codex --version &&
            opencode --version &&
            pi --version &&
            omp --version &&
            echo "=== Python ===" &&
            python --version &&
            python -m pytest --version &&
            echo "=== Git ===" &&
            git --version &&
            echo "=== All harnesses ready ==="
          '
