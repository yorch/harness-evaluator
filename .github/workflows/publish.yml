name: Publish to PyPI

# Manual fallback for republishing a release.
# Automatic publishing is now handled by release-please.yml, which runs
# publish + docker in the same workflow (tags created by GITHUB_TOKEN
# do not trigger downstream `on: push: tags` workflows).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build and publish (e.g. v0.3.0)"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build sdist and wheel
        run: uv build
      - name: Verify the wheel bundles the task library
        run: |
          python -m zipfile -l dist/*.whl | grep -q "harness_evaluator/tasks/" \
            || (echo "task library not bundled in wheel" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC) — configure a PyPI publisher for this repo.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  upload-assets:
    name: Upload artifacts to GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload wheel and sdist to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # release-please creates the release with changelog notes;
          # we just attach the build artifacts and append artifact links.
          gh release upload "$tag" dist/*.whl dist/*.tar.gz --clobber

          # Append artifact footer to the release notes
          gh release view "$tag" --json body --jq '.body' > /tmp/release_body.md
          {
            cat /tmp/release_body.md
            echo ""
            echo "## Artifacts"
            echo ""
            echo "- **PyPI**: [\`harness-evaluator==${version}\`](https://pypi.org/project/harness-evaluator/${version}/)"
            echo "- **Docker**: \`ghcr.io/yorch/harness-evaluator-runner:${version}\` and \`:latest\`"
            echo "- **Docs**: https://yorch.github.io/harness-evaluator/"
            echo ""
            echo "Install with \`uvx harness-evaluator\` or \`pip install harness-evaluator==${version}\`."
          } > /tmp/release_final.md
          gh release edit "$tag" --notes-file /tmp/release_final.md

  verify-pypi:
    name: Verify PyPI publication
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Confirm package is live on PyPI
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          attempts=8
          delay=15
          for attempt in $(seq "$attempts"); do
            actual=$(curl -sf "https://pypi.org/pypi/harness-evaluator/${version}/json" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || true)
            if [ "$actual" = "$version" ]; then
              echo "harness-evaluator==${version} is live on PyPI"
              exit 0
            fi
            echo "Attempt $attempt: PyPI shows ${actual:-<none>}, expected $version"
            [ "$attempt" -eq "$attempts" ] || sleep "$delay"
          done
          echo "PyPI publication verification failed" >&2
          exit 1
