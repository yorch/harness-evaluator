name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build sdist and wheel
        run: uv build
      - name: Verify the wheel bundles the task library
        run: |
          python -m zipfile -l dist/*.whl | grep -q "harness_evaluator/tasks/" \
            || (echo "task library not bundled in wheel" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC) — configure a PyPI publisher for this repo.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, uploading assets"
            gh release upload "$tag" dist/*.whl dist/*.tar.gz --clobber
          else
            # Generate release notes, then append artifact links
            gh release create "$tag" \
              --title "$version" \
              --generate-notes \
              dist/*.whl dist/*.tar.gz

            # Append artifact footer to the auto-generated notes
            gh release view "$tag" --json body --jq '.body' > /tmp/release_body.md
            {
              cat /tmp/release_body.md
              echo ""
              echo "## Artifacts"
              echo ""
              echo "- **PyPI**: [\`harness-evaluator==${version}\`](https://pypi.org/project/harness-evaluator/${version}/)"
              echo "- **Docker**: \`ghcr.io/yorch/harness-evaluator-runner:${version}\` and \`:latest\`"
              echo "- **Docs**: https://yorch.github.io/harness-evaluator/"
              echo ""
              echo "Install with \`uvx harness-evaluator\` or \`pip install harness-evaluator==${version}\`."
              echo ""
              echo "Generated with [Devin](https://devin.ai)"
            } > /tmp/release_final.md
            gh release edit "$tag" --notes-file /tmp/release_final.md
          fi
