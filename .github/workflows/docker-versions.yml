name: Docker — per-harness version images

# Build and publish a runner image with a specific harness version override.
# Triggered manually (workflow_dispatch) so you publish a version image only
# when you need it — the default-version image is published by docker.yml on
# every push to main.
#
# The resulting image is tagged `<harness>-<version>` on the runner repository,
# e.g. ghcr.io/yorch/harnessbench-runner:claude-code-2.0.0. Reference it in a run
# config via HarnessSpec.docker_image or the `version` shorthand.

on:
  workflow_dispatch:
    inputs:
      harness:
        description: "Harness build arg to override (e.g. CLAUDE_CODE_VERSION)"
        required: true
        type: choice
        options:
          - CLAUDE_CODE_VERSION
          - CODEX_VERSION
          - OPENCODE_VERSION
          - PI_VERSION
          - OMP_VERSION
          - BUN_VERSION
      version:
        description: "Version to pin (e.g. 2.0.0)"
        required: true
        type: string
      tag_prefix:
        description: "Tag prefix (defaults to the harness short name, e.g. claude-code)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ inputs.harness }}=${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: tag
        run: |
          # Map CLAUDE_CODE_VERSION -> claude-code, etc.
          declare -A PREFIX_MAP=(
            [CLAUDE_CODE_VERSION]=claude-code
            [CODEX_VERSION]=codex
            [OPENCODE_VERSION]=opencode
            [PI_VERSION]=pi
            [OMP_VERSION]=omp
            [BUN_VERSION]=bun
          )
          PREFIX="${{ inputs.tag_prefix }}"
          if [ -z "$PREFIX" ]; then
            PREFIX="${PREFIX_MAP[${{ inputs.harness }}]}"
          fi
          TAG="${PREFIX}-${{ inputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building image tag: $TAG"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/harnessbench-runner:${{ steps.tag.outputs.tag }}
          build-args: |
            ${{ inputs.harness }}=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the harness is installed at the requested version
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/harnessbench-runner:${{ steps.tag.outputs.tag }}"
          docker pull "$IMAGE"
          # The image labels record the installed versions.
          docker inspect "$IMAGE" --format='{{json .Config.Labels}}' | \
            python3 -c "import json,sys; labels=json.load(sys.stdin); print(json.dumps(labels, indent=2))"
