[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-evaluator"
version = "0.11.0"
description = "Harness evaluator: compare agentic coding harnesses on token/time/cost effectiveness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "httpx>=0.27",
    "textual>=8.2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/yorch/harness-evaluator"
Documentation = "https://yorch.github.io/harness-evaluator/"
Source = "https://github.com/yorch/harness-evaluator"
Issues = "https://github.com/yorch/harness-evaluator/issues"

[project.scripts]
harness-evaluator = "harness_evaluator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_evaluator"]

# Bundle the task library (YAMLs + repo fixtures) into the wheel at
# harness_evaluator/tasks so an installed `harness-evaluator` can run without a repo checkout.
[tool.hatch.build.targets.wheel.force-include]
"tasks" = "harness_evaluator/tasks"
"config" = "harness_evaluator/config"

[tool.hatch.build.targets.sdist]
include = ["src/harness_evaluator", "tasks", "config", "runs", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["harness_evaluator"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["harness_evaluator"]

[[tool.mypy.overrides]]
module = ["pandas", "statsmodels.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
