# Sample run configuration for harness-evaluator
# Full sweep: all 5 harnesses, 2 providers, both task tracks.
# For a minimal first run, see sample-minimal.yaml.
name: "broad-first-pass"
description: "Broad first pass: all 5 harnesses, 2 providers, both task tracks"

harnesses:
  - name: opencode
    adapter: opencode
    observability_tier: full
    config:
      mode: agent

  - name: claude-code
    adapter: claude-code
    observability_tier: partial
    config:
      max_turns: 50

  - name: codex
    adapter: codex
    observability_tier: partial
    config: {}

  - name: pi
    adapter: pi
    observability_tier: minimal
    config: {}

  - name: omp
    adapter: omp
    observability_tier: minimal
    config: {}

models:
  - name: claude-sonnet-5
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    config:
      max_tokens: 16384

  - name: gpt-5.6-terra
    provider: openai
    api_key_env: OPENAI_API_KEY
    config:
      max_tokens: 16384

tasks:
  # All 20 single-phase tasks (SWE + open-ended). The multi-phase task
  # (multi-phase-bugfix-001) is excluded — it requires review models and
  # has its own sample config in sample-multi-phase.yaml.
  # SWE (Python)
  - swe-bugfix-001
  - swe-bugfix-002
  - swe-bugfix-003
  - swe-bugfix-004
  - swe-bugfix-005
  - swe-feature-001
  - swe-feature-002
  - swe-feature-003
  - swe-refactor-001
  - swe-refactor-002
  - swe-perf-001
  - swe-perf-002
  # Open-ended (Python + TypeScript)
  - open-design-001
  - open-design-002
  - open-design-003
  - open-design-004
  - open-design-005
  - open-design-006
  - open-design-007
  - open-design-008

task_library_path: "./tasks"
repeats: 5
budget_usd: 100.0
gateway_port: 8877
gateway_db: "harness_evaluator_gateway.db"
results_db: "harness_evaluator_results.db"
workdir: "./harness_evaluator_workdir"
docker_image: "harness-evaluator-runner:latest"
parallel_runs: 1
