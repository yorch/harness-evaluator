# Minimal run configuration for harness-evaluator — safe first run.
# Uses one harness, one model, one task, one repeat.
# Requires ANTHROPIC_API_KEY, and the runner image set in docker_image below:
#   docker pull ghcr.io/yorch/harness-evaluator-runner:latest
name: "minimal-first-run"
description: "Minimal first run: one harness, one model, one task"

harnesses:
  - name: opencode
    adapter: opencode
    observability_tier: full
    config:
      mode: agent

models:
  - name: claude-sonnet-5
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    config:
      max_tokens: 16384

tasks:
  - "swe-bugfix-001"

task_library_path: "./tasks"
repeats: 1
budget_usd: 5.0
gateway_port: 8877
gateway_db: "harness_evaluator_gateway.db"
results_db: "harness_evaluator_results.db"
workdir: "./harness_evaluator_workdir"
# Uses the pre-built GHCR image (what the docs tell you to pull). To use a
# locally built image, replace this with "harness-evaluator-runner:latest".
docker_image: "ghcr.io/yorch/harness-evaluator-runner:latest"
parallel_runs: 1
