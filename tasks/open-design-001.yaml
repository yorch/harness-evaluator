# Sample task: open-ended design task
tasks:
  - id: open-design-001
    name: "Design and implement a caching decorator"
    track: open_ended
    difficulty: medium
    description: |
      Design and implement a small caching decorator in Python.
      Add tests and write a short README explaining the design.
    task_prompt: |
      Design and implement a `@cached` decorator in src/cache.py that:
      - Caches function results based on arguments
      - Has a max_size parameter (default 128)
      - Uses LRU eviction when cache is full
      - Is thread-safe

      Add comprehensive tests in tests/test_cache.py.
      Write a short README.md explaining your design choices.
    test_command: "python -m pytest tests/test_cache.py -v"
    expected_files:
      - src/cache.py
      - tests/test_cache.py
      - README.md
    timeout_seconds: 300
