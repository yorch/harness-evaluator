tasks:
- id: swe-bugfix-005
  name: Fix sumPositive to include zeros and handle empty arrays
  track: swe
  difficulty: easy
  description: The `sumPositive` function in src/solution.ts is supposed to sum all non-negative
    numbers (zero and positive) in an array. It has two bugs — it filters with `> 0` instead of
    `>= 0` (excluding zero values), and it initializes the accumulator to `null` instead of `0`,
    causing it to return `null` instead of `0` for empty arrays or arrays with no positive values.
    Fix both bugs so that all tests pass.
  repo_url: tasks/repos/swe-bugfix-005
  repo_commit: 7a3c9e1f4b2d8a5601c3e7f9d4a8b6c2e0f1d3a5
  setup_script: bun install
  task_prompt: |-
    Fix the `sumPositive` function in src/solution.ts.

    The function should sum all non-negative numbers (zero and positive) in the input array.
    It has two bugs:
    1. It filters with `> 0` instead of `>= 0`, so zero values are incorrectly excluded.
    2. It initializes the accumulator to `null` instead of `0`, so it returns `null`
       (not `0`) for empty arrays or arrays containing only zeros/negatives.

    After fixing, the function should:
    - Return 0 for an empty array
    - Return 0 for an array with only zeros
    - Include zero values in the sum (e.g. [5, 0, 10] -> 15)
    - Still correctly sum positive numbers and ignore negatives

    Run tests with: bun test
  test_command: bun test
  test_patch: |
    diff --git a/tests/test_hidden.test.ts b/tests/test_hidden.test.ts
    new file mode 100644
    index 0000000..a1b2c3d
    --- /dev/null
    +++ b/tests/test_hidden.test.ts
    @@ -0,0 +1,20 @@
    +import { describe, it, expect } from 'bun:test';
    +import { sumPositive } from '../src/solution';
    +
    +describe('sumPositive hidden tests', () => {
    +  it('should include zero values in the sum', () => {
    +    expect(sumPositive([0, 0, 0])).toBe(0);
    +  });
    +
    +  it('should return 0 for an empty array', () => {
    +    expect(sumPositive([])).toBe(0);
    +  });
    +
    +  it('should handle mixed positive and zero values', () => {
    +    expect(sumPositive([5, 0, 10])).toBe(15);
    +  });
    +
    +  it('should return 0 for a single zero', () => {
    +    expect(sumPositive([0])).toBe(0);
    +  });
    +});
  expected_files:
  - src/solution.ts
  timeout_seconds: 300
  metadata:
    bug_type: logic_error
    language: typescript
    test_count: 6
